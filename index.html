<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 날씨 맞춤 추천</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; background: #f4f7fb; color: #1d2433; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    #chat { width: 420px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #dde3ee; }
    header { padding: 14px 16px; border-bottom: 1px solid #e6ebf3; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    header p { margin: 0; font-size: 12px; color: #6b778f; }
    #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2f6bff; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #eef2f9; border-bottom-left-radius: 4px; }
    .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 5px; }
    .tool { font-size: 11px; background: #fff4d6; color: #7a5a00; border: 1px solid #f0dca0; border-radius: 999px; padding: 2px 9px; }
    .tool.w { background: #dff4ff; color: #04567a; border-color: #aedcf2; }
    .err { background: #ffe9e9; color: #a02020; }
    details.raw { align-self: stretch; font-size: 12px; background: #1e2433; color: #d6e2ff; border-radius: 8px; padding: 6px 10px; }
    details.raw summary { cursor: pointer; color: #9fc0ff; }
    details.raw pre { margin: 8px 0 2px; max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .chips { padding: 0 14px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font-size: 12px; background: #fff; border: 1px solid #cfd8e8; border-radius: 999px; padding: 5px 10px; cursor: pointer; color: #3a4a6b; }
    .chips button:hover { background: #eef2f9; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e6ebf3; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #cfd8e8; border-radius: 8px; font-size: 14px; }
    form button { padding: 0 16px; border: 0; border-radius: 8px; background: #2f6bff; color: #fff; font-size: 14px; cursor: pointer; }
    form button:disabled { background: #9db6ee; cursor: default; }
    #map { flex: 1; }
    .dots span { animation: b 1s infinite; display: inline-block; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-4px); } }
    .games { display: flex; gap: 8px; margin-top: 10px; }
    .games a { flex: 1; text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; color: #fff; padding: 8px 6px; border-radius: 8px; background: linear-gradient(#ffb02a, #ff6a1a); }
    .games a.race { background: linear-gradient(#3aa0ff, #1a5ae0); }
    .games a:hover { filter: brightness(1.1); }
    @media (max-width: 800px) { body { flex-direction: column-reverse; } #chat { width: 100%; height: 60%; border-right: 0; } #map { height: 40%; flex: none; } }
  </style>
</head>
<body>
  <section id="chat">
    <header>
      <h1>🌴 제주 날씨 맞춤 추천</h1>
      <p>에이전트가 날씨(Open-Meteo)와 관광지 목록을 직접 검색해서 추천합니다.</p>
      <div class="games">
        <a href="jeju_citrus_game.html">🍊 감귤 수확 게임</a>
        <a href="racing3d.html" class="race">🏎 3D 레이싱 (1~2인)</a>
      </div>
    </header>
    <div id="log"></div>
    <div class="chips" id="chips">
      <button>이번 주말 서귀포 가려는데 어디 갈까?</button>
      <button>비 오면 동쪽에서 뭐 하지?</button>
      <button>내일 제주시 야외 코스 추천해줘</button>
    </div>
    <form id="f">
      <input id="q" placeholder="예: 내일 서쪽에서 가볼 만한 곳" autocomplete="off" required maxlength="300">
      <button id="send">보내기</button>
    </form>
  </section>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const map = L.map("map").setView([33.38, 126.55], 9);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const history = [];

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      $("log").appendChild(d);
      $("log").scrollTop = $("log").scrollHeight;
      return d;
    }

    // 제미나이가 보낸 응답을 가공 없이 펼쳐 볼 수 있게 한다. 콘솔(F12)에도 객체로 출력한다.
    function showRaw(data) {
      (data.debug || []).forEach((d, i) => {
        console.log(`[제미나이 원본 응답 #${i + 1}] 모델=${d.model} HTTP ${d.status}`, d.raw);
        const box = document.createElement("details");
        box.className = "raw";
        const sum = document.createElement("summary");
        sum.textContent = `제미나이 원본 응답 #${i + 1} · ${d.model} · HTTP ${d.status}`;
        const pre = document.createElement("pre");
        pre.textContent = typeof d.raw === "string" ? d.raw : JSON.stringify(d.raw, null, 2);
        box.append(sum, pre);
        $("log").appendChild(box);
      });
      (data.toolResults || []).forEach((t) => console.log(`[도구 실행 결과] ${t.name}`, t.input, t.output));
      $("log").scrollTop = $("log").scrollHeight;
    }

    function showTools(calls) {
      if (!calls.length) return;
      const d = document.createElement("div");
      d.className = "tools";
      d.innerHTML = calls.map((c) => {
        const args = Object.values(c.input || {}).join(", ");
        return `<span class="tool ${c.name === "get_weather" ? "w" : ""}">🔧 ${esc(c.name)}(${esc(args)})</span>`;
      }).join("");
      $("log").appendChild(d);
    }

    function showMap(spots, reply) {
      layer.clearLayers();
      const pts = [];
      spots.forEach((s) => {
        if (typeof s.lat !== "number") return;
        const picked = reply.includes(s.name);
        L.circleMarker([s.lat, s.lng], {
          radius: picked ? 10 : 6, color: picked ? "#d62839" : "#6b86c9", weight: 2,
          fillColor: picked ? "#ff4d5e" : "#9db6ee", fillOpacity: picked ? 0.9 : 0.6,
        }).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.areas)} · ${s.indoor ? "실내" : "야외"}<br>${esc(s.description)}${picked ? "<br>⭐ 추천" : ""}`).addTo(layer);
        pts.push([s.lat, s.lng]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
    }

    async function ask(text) {
      if (!/^https?:$/.test(location.protocol)) {
        add("bot err", "이 페이지가 파일로 열려 있어 서버(/api/chat)에 연결할 수 없습니다. 배포된 Vercel 주소(https://…vercel.app)로 접속해 주세요.");
        console.error("[열린 주소]", location.href, "→ file:// 로 열면 /api/chat 을 호출할 수 없습니다.");
        return;
      }
      history.push({ role: "user", content: text });
      add("user", text);
      $("chips").style.display = "none";
      $("send").disabled = true;
      const wait = add("bot", "");
      wait.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span> 날씨와 관광지를 검색하는 중…';
      let data;
      try {
        let res;
        // 한도 초과(429)면 안내를 띄우고 잠시 기다렸다가 자동으로 다시 보낸다(최대 3번).
        for (let attempt = 0; ; attempt++) {
          res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
          const rawText = await res.text();
          console.log("[서버 응답 원문] HTTP", res.status, rawText);
          try { data = JSON.parse(rawText); } catch { throw new Error(`서버가 JSON 이 아닌 응답을 보냈습니다 (HTTP ${res.status}). 콘솔의 원문을 확인하세요.`); }
          console.log("[서버 응답 객체]", data);
          showRaw(data);
          if (!data.rateLimited || attempt >= 3) break;
          const sec = Math.min(Math.max(Number(data.retryAfter) || 10, 5), 30);
          for (let s = sec; s > 0; s--) {
            wait.textContent = `사용자가 많아 잠시 기다리는 중… ${s}초 뒤 자동으로 다시 시도합니다 (${attempt + 1}/3)`;
            await new Promise((r) => setTimeout(r, 1000));
          }
          wait.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span> 다시 시도하는 중…';
        }
        wait.remove();
        if (data.rateLimited) throw new Error("사용자가 많아 아직 처리하지 못했습니다. 1분쯤 뒤에 다시 질문해 주세요.");
        if (!res.ok) throw new Error(data.error || res.status);
        showTools(data.toolCalls);
        add("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
        showMap(data.spots, data.reply);
      } catch (e) {
        wait.remove();
        history.pop();
        add("bot err", "오류: " + e.message);
      } finally {
        $("send").disabled = false;
        $("q").focus();
      }
    }

    $("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const t = $("q").value.trim();
      if (!t) return;
      $("q").value = "";
      ask(t);
    });
    $("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });

    add("bot", "안녕하세요! 가고 싶은 지역이나 날짜, 분위기를 말씀해 주세요. 날씨를 확인해서 실내/야외를 골라 추천해 드릴게요.");
  </script>
</body>
</html>
