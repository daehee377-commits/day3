<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 관광지 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    form { padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; }
    #msg { color: #555; font-size: 14px; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <form id="f">
    <label>지역
      <select id="area">
        <option>동쪽</option><option>서쪽</option><option>서귀포</option><option>제주시</option>
      </select>
    </label>
    <label>실내 여부
      <select id="indoor">
        <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
      </select>
    </label>
    <button type="submit">지도에 표시</button>
    <span id="msg"></span>
  </form>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([33.38, 126.55], 9);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const layer = L.layerGroup().addTo(map);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const params = new URLSearchParams({ area: area.value });
      if (indoor.value) params.set("indoor", indoor.value);

      const res = await fetch("/api/find_spots?" + params);
      const data = await res.json();
      layer.clearLayers();
      if (data.error) { msg.textContent = data.error; return; }

      const points = data.spots.map((s) => {
        L.marker([s.lat, s.lng])
          .bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.areas)} · ${s.indoor ? "실내" : "야외"}<br>${esc(s.description)}`)
          .addTo(layer);
        return [s.lat, s.lng];
      });
      msg.textContent = `${data.total}곳 중 ${data.spots.length}곳 표시`;
      if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 12 });
    });
  </script>
</body>
</html>
