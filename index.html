<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 날씨 맞춤 추천</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; background: #f4f7fb; color: #1d2433; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    #chat { width: 420px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #dde3ee; }
    header { padding: 14px 16px; border-bottom: 1px solid #e6ebf3; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    header p { margin: 0; font-size: 12px; color: #6b778f; }
    #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2f6bff; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #eef2f9; border-bottom-left-radius: 4px; }
    .tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 5px; }
    .tool { font-size: 11px; background: #fff4d6; color: #7a5a00; border: 1px solid #f0dca0; border-radius: 999px; padding: 2px 9px; }
    .tool.w { background: #dff4ff; color: #04567a; border-color: #aedcf2; }
    .err { background: #ffe9e9; color: #a02020; }
    .chips { padding: 0 14px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font-size: 12px; background: #fff; border: 1px solid #cfd8e8; border-radius: 999px; padding: 5px 10px; cursor: pointer; color: #3a4a6b; }
    .chips button:hover { background: #eef2f9; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e6ebf3; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #cfd8e8; border-radius: 8px; font-size: 14px; }
    form button { padding: 0 16px; border: 0; border-radius: 8px; background: #2f6bff; color: #fff; font-size: 14px; cursor: pointer; }
    form button:disabled { background: #9db6ee; cursor: default; }
    #map { flex: 1; }
    .dots span { animation: b 1s infinite; display: inline-block; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 0%, 60%, 100% { transform: none; } 30% { transform: translateY(-4px); } }
    @media (max-width: 800px) { body { flex-direction: column-reverse; } #chat { width: 100%; height: 60%; border-right: 0; } #map { height: 40%; flex: none; } }
  </style>
</head>
<body>
  <section id="chat">
    <header>
      <h1>🌴 제주 날씨 맞춤 추천</h1>
      <p>에이전트가 날씨(Open-Meteo)와 관광지 목록을 직접 검색해서 추천합니다.</p>
    </header>
    <div id="log"></div>
    <div class="chips" id="chips">
      <button>이번 주말 서귀포 가려는데 어디 갈까?</button>
      <button>비 오면 동쪽에서 뭐 하지?</button>
      <button>내일 제주시 야외 코스 추천해줘</button>
    </div>
    <form id="f">
      <input id="q" placeholder="예: 내일 서쪽에서 가볼 만한 곳" autocomplete="off" required maxlength="300">
      <button id="send">보내기</button>
    </form>
  </section>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const map = L.map("map").setView([33.38, 126.55], 9);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const history = [];

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      $("log").appendChild(d);
      $("log").scrollTop = $("log").scrollHeight;
      return d;
    }

    function showTools(calls) {
      if (!calls.length) return;
      const d = document.createElement("div");
      d.className = "tools";
      d.innerHTML = calls.map((c) => {
        const args = Object.values(c.input || {}).join(", ");
        return `<span class="tool ${c.name === "get_weather" ? "w" : ""}">🔧 ${esc(c.name)}(${esc(args)})</span>`;
      }).join("");
      $("log").appendChild(d);
    }

    function showMap(spots, reply) {
      layer.clearLayers();
      const pts = [];
      spots.forEach((s) => {
        if (typeof s.lat !== "number") return;
        const picked = reply.includes(s.name);
        L.circleMarker([s.lat, s.lng], {
          radius: picked ? 10 : 6, color: picked ? "#d62839" : "#6b86c9", weight: 2,
          fillColor: picked ? "#ff4d5e" : "#9db6ee", fillOpacity: picked ? 0.9 : 0.6,
        }).bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.areas)} · ${s.indoor ? "실내" : "야외"}<br>${esc(s.description)}${picked ? "<br>⭐ 추천" : ""}`).addTo(layer);
        pts.push([s.lat, s.lng]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
    }

    async function ask(text) {
      history.push({ role: "user", content: text });
      add("user", text);
      $("chips").style.display = "none";
      $("send").disabled = true;
      const wait = add("bot", "");
      wait.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span> 날씨와 관광지를 검색하는 중…';
      try {
        const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
        const data = await res.json();
        wait.remove();
        if (!res.ok) throw new Error(data.error || res.status);
        showTools(data.toolCalls);
        add("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
        showMap(data.spots, data.reply);
      } catch (e) {
        wait.remove();
        history.pop();
        add("bot err", "오류: " + e.message);
      } finally {
        $("send").disabled = false;
        $("q").focus();
      }
    }

    $("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const t = $("q").value.trim();
      if (!t) return;
      $("q").value = "";
      ask(t);
    });
    $("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });

    add("bot", "안녕하세요! 가고 싶은 지역이나 날짜, 분위기를 말씀해 주세요. 날씨를 확인해서 실내/야외를 골라 추천해 드릴게요.");
  </script>
</body>
</html>
